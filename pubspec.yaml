name: flutter_education_app
description: Complete educational platform with VOD and live streaming
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  share_plus: ^13.3.1
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  webview_flutter: ^4.4.2
  cupertino_icons: ^1.0.6
  cached_network_image: ^4.0.4
  file_picker: ^13.1.0
  image_picker: ^1.0.5
  intl: ^0.20.2
  fluttertoast: ^10.0.2
  url_launcher: ^6.2.2
  flutter_localizations:
    sdk: flutter
  flutter_native_splash:
  permission_handler: ^13.0.2
  collection: '>=1.16.0'
  clock: ^1.1.3   # already locked (transitive); the studio's double-click timing follows the test clock
  nested: any
  flutter_webrtc: ^1.6.0
  responsive_framework: ^1.5.1
  moyasar: ^3.0.2
  path: any
  cross_file: any
  timeago: ^3.7.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  firebase_crashlytics: ^6.0.0
  firebase_remote_config: ^7.0.0
  video_player: ^2.9.2
  wakelock_plus: ^1.2.10
  livekit_client: ^2.8.0
  loading_animation_widget: ^1.3.0
  bluetooth_low_energy: ^6.0.0
  # Modern replacement for dart:html / dart:js_util (both removed on recent
  # Dart SDKs). Used only inside web_notification_web.dart.
  web: ^1.1.0
  flutter_secure_storage: ^11.2.0
  # X25519 / AES-GCM / HKDF for the app-layer envelope encryption in
  # api_client.dart. NOT the same package as `crypto` above (that one is
  # hash-only — sha256 for certificate pinning); this one is a different
  # pub.dev package and both are needed.
  cryptography: ^2.7.0
  android_id: ^0.6.0
  # Pinned: 1.5.2+ applies kotlin-android only on AGP < 9, so with
  # android.builtInKotlin=false its Kotlin code is never compiled.
  screen_protector: 1.5.1
  file_saver: ^0.7.0
  # Picture-in-Picture (minimize) for the video player — Android only.
  floating: ^6.0.0
  # AES-CTR for the encrypted offline downloads.
  pointycastle:
  crypto: any
  http_parser: any
  package_info_plus: any
  http: any
  device_info_plus: ^13.3.0
  uuid: any
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  # Camera QR scanner for organization join codes (org_join_scan.dart).
  mobile_scanner: ^7.4.2
  # Relay-based offline attendance: short-range link (BLE + Wi-Fi Direct) between an offline
  # student and an online classmate. Android only; needs Google Play services.
  nearby_connections: ^4.0.0
  # One online/offline answer for the app.
  firebase_auth: ^7.0.0
  geolocator: ^14.0.1
  connectivity_plus: ^7.3.1
  network_info_plus: ^8.2.1
  pdf: ^3.13.1
  # the shaping / reordering package:pdf itself uses: PDF exports draw RTL words pre-shaped (exportPdfText)
  bidi: ^2.0.13
  archive: ^4.5.2
  image: ^4.12.0
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1
  local_auth: ^3.0.2
dependency_overrides:
  # The fork rebased on upstream v1.6.2+hotfix.4 (the exact version livekit_client 2.13.1 pins, WebRTC-SDK
  # 150.7871.01 on Android and iOS), branch nextbrain/1.6.2-hotfix.4: the single-projection screen-share capturer,
  # device audio for screen share, the mic soft mute (D-080). Pinned to a commit on purpose (D-010); for local
  # fork work use `path: ../flutter-webrtc` and pin again before committing.
  flutter_webrtc:
    git:
      url: https://github.com/Amadkour/flutter-webrtc.git
      ref: 00e021c345fe7d2f541058354b122b6e9a21fbde

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translation.json
    # (page_id, role) pairs that have help: the Info button shows from it with no request (tool/gen_help_index.dart)
    - assets/help/help_index.json
    # the timezone database for the web (lib/core/tz_database_web.dart); a copy of package:timezone lib/data/latest.tzf
    - assets/tz/latest.tzf
    # UI fonts the person can choose (lib/core/display/app_fonts.dart): loaded by FontLoader when chosen
    - assets/fonts/ui/readex/
    - assets/fonts/ui/noto_kufi/
    - assets/fonts/ui/almarai/
    - assets/fonts/ui/cairo/
    - assets/fonts/ui/baloo/
    - assets/fonts/ui/jakarta/
    - assets/fonts/ui/lexend/
    - assets/fonts/ui/atkinson/
    - assets/fonts/ui/nunito/
    # certificate fonts — the SAME static files the server renders with (preview == issued certificate). Plain
    # assets, not `fonts:`: the web build would download all 27 at start-up. The certificate studio registers them
    # (FontLoader) when a studio opens, the exports load the bytes of the fonts they use
    # (lib/design/export/export_fonts.dart, 7.1)
    - assets/fonts/cert/
  fonts:
    # exam papers (exam_paper.dart): full Arabic presentation forms, which package:pdf needs (Cairo / Tajawal lack some)
    - family: PaperPlex
      fonts:
        - asset: assets/fonts/plex/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/plex/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: bahji
      fonts:
        - asset: assets/fonts/Bahij_TheSansArabic-Bold.ttf
          style: italic
    # the app's text family: every weight the UI asks for (600 resolves to Bold). With the Regular file alone,
    # FontWeight.w600-w900 rendered as Regular (Flutter does not synthesize bold): titles, names and figures
    # lost their hierarchy (docs/polish/visual-review.md).
    - family: tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900
    # the default UI fonts (premium, OFL): available from the first frame; the other choices are the asset
    # folders above. AppFonts.family picks per language; never write the family name in a TextStyle.
    - family: uiPlexArabic
      fonts:
        - asset: assets/fonts/ui/plex_arabic/IBMPlexSansArabic-400.ttf
        - asset: assets/fonts/ui/plex_arabic/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/ui/plex_arabic/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/ui/plex_arabic/IBMPlexSansArabic-700.ttf
          weight: 700
    - family: uiInter
      fonts:
        - asset: assets/fonts/ui/inter/Inter-400.ttf
        - asset: assets/fonts/ui/inter/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/ui/inter/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/ui/inter/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/ui/inter/Inter-800.ttf
          weight: 800
    # the editorial heading faces (D-611, D-631): Amiri Bold, a high-contrast naskh, for Arabic headings and Playfair
    # Display 600 / 700 for Latin headings (OFL, assets/fonts/editorial/OFL.txt; subset to their scripts). Pubspec
    # fonts so headings draw from the first frame; the web prune step keeps them in FontManifest.json. Never named in
    # a TextStyle: AppFonts.editorial / AppFonts.editorialFamily pick one by language.
    - family: uiEditorial
      fonts:
        - asset: assets/fonts/editorial/Amiri-Bold.ttf
          weight: 700
    - family: uiEditorialLatin
      fonts:
        - asset: assets/fonts/editorial/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/editorial/PlayfairDisplay-700.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          style: italic

# ─────────────────────────────────────────────────────────────────────────────
# App launcher icon (was completely missing — this is why the project icon
# was showing the default Flutter icon instead of your logo).
# Run: dart run flutter_launcher_icons
# dart run flutter_launcher_icons:generate -o
# ─────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true

  # Main fallback image
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#D4FEFD"
  adaptive_icon_foreground: "assets/icon/adaptive_icon_foreground.png"

  # Explicitly set the paths for web and desktop platforms to stop the fallback error
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

# ─────────────────────────────────────────────────────────────────────────────
# Splash screen
# android_12 now points at a SEPARATE, padded image (splash_android12.png)
# instead of reusing the full-bleed splash.png. Android 12+ renders this
# image inside a fixed circular "safe zone" (~1/3 of a 960x960 canvas,
# centered) and clips anything outside it — reusing the full-bleed logo is
# exactly why it was being cropped before.
# Run: dart run flutter_native_splash:create
# ─────────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#F4FBFF"          # Alfaheem light
  color_dark: "#0D3B7A"     # Alfaheem navy (dark)

  image: assets/images/splash_alfaheem.png
  image_dark: assets/images/splash_alfaheem.png

  android_gravity: center
  ios_content_mode: center

  fullscreen: true

  # Android 12+ specific configuration (required for newer Android versions)
  android_12:
    image: assets/images/splash_android12.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"
    color: "#F4FBFF"
    color_dark: "#0D3B7A"
  web: true
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  xml: 7.0.1
