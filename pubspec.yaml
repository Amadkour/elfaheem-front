name: flutter_education_app
description: Complete educational platform with VOD and live streaming
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  chewie: ^1.7.4
  webview_flutter: ^4.4.2
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0
  file_picker: ^11.0.2
  image_picker: ^1.0.5
  intl: ^0.20.2
  fluttertoast: ^9.0.0
  url_launcher: ^6.2.2
  flutter_localizations:
    sdk: flutter
  flutter_native_splash:
  flutter_background: ^1.1.0
  permission_handler: ^11.3.1
  logging: ^1.0.1
  flutter_svg: ^2.0.5
  collection: '>=1.16.0'
  nested: any
  flutter_webrtc: ^1.4.0
  mime: any
  responsive_framework: ^1.5.1
  moyasar: ^3.0.2
  path: any
  cross_file: any
  timeago: ^3.7.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_crashlytics: ^5.2.2
  firebase_remote_config: ^6.5.1
  video_player: ^2.9.2
  wakelock_plus: ^1.2.10
  livekit_client: ^2.8.0
dependency_overrides:
  # Pin packages that use Apple APIs unavailable on CI runner's Xcode version.
  connectivity_plus: '>=7.0.0 <7.1.0' # NWPath.isUltraConstrained
  device_info_plus: '>=12.3.0 <12.4.0' # NSProcessInfo.isiOSAppOnVision
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translation.json
  fonts:
    - family: bahji
      fonts:
        - asset: assets/fonts/Bahij_TheSansArabic-Bold.ttf
          style: italic
    - family: tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          style: italic
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          style: italic
flutter_native_splash:
  # Premium theme — Brand Yellow & Dark Charcoal.
  # These must stay in sync with AppTheme.darkBackground (#1A1A1A) and
  # AppTheme.primary (#F4C542) in lib/config/theme/app_theme.dart, and with
  # the hard-coded colors in main.dart's _PremiumLoadingScreen, so there is
  # no visible color change handing off from native splash -> Flutter splash
  # -> live app on any platform.
  color: "#1A1A1A"
  color_dark: "#1A1A1A"

  image: assets/images/splash.png
  image_dark: assets/images/splash.png

  android_gravity: center
  ios_content_mode: center

  fullscreen: true

  # Android 12+ specific configuration (required for newer Android versions)
  android_12:
    image: assets/images/splash.png
    icon_background_color: "#1A1A1A"
    color: "#1A1A1A"
    color_dark: "#1A1A1A"

  web: true
dev_dependencies:
  flutter_test: any