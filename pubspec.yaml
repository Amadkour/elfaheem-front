    - family: CertArefRuqaaBold
      fonts:
        - asset: assets/fonts/cert/ArefRuqaa-Bold.ttf
    - family: CertScheherazade
      fonts:
        - asset: assets/fonts/cert/ScheherazadeNew-Regular.ttf
    - family: CertScheherazadeBold
