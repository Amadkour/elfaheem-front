  <!-- Install prompt capture (Chrome / Edge / Android). The Dart side reads window.nbPwa, listens for
       'nb-pwa-installable' / 'nb-pwa-installed' and calls window.nbPwaPrompt() -> 'accepted' | 'dismissed' | 'unavailable'.
       Must run before flutter_bootstrap.js: beforeinstallprompt can fire before Dart is up. -->
  <script>
    (function () {
      var nbPwa = window.nbPwa = { deferred: null, installed: false };
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        nbPwa.deferred = e;
        window.dispatchEvent(new Event('nb-pwa-installable'));
      });
      window.addEventListener('appinstalled', function () {
        nbPwa.deferred = null;
        nbPwa.installed = true;
        window.dispatchEvent(new Event('nb-pwa-installed'));
      });
      window.nbPwaPrompt = async function () {
        const d = nbPwa.deferred;
        if (!d) return 'unavailable';
        nbPwa.deferred = null;
        try {
          d.prompt();
          const r = await d.userChoice;
          return r && r.outcome || 'dismissed';
        } catch (e) {
          return 'unavailable';
        }
      };
    })();
  </script>
