  <style>
    :root {
      --bg: #FBF7EC;
      --card: #FFFFFF;
      --ink: #1B2A24;
      --muted: #5B6B63;
      --accent: #0F7B5F;
      --on-accent: #FFFFFF;
      --line: rgba(15, 123, 95, 0.16);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B2A22;
        --card: #0F3A2E;
        --ink: #F3EFE3;
        --muted: #B9C9C0;
        --accent: #FBF7EC;
        --on-accent: #0F5A46;
        --line: rgba(251, 247, 236, 0.18);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 20px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 4px; color: var(--muted); }
    .en { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
    .en h1 { font-size: 1.15rem; }
    button {
      margin-top: 24px;
      min-height: 48px;
      min-width: 160px;
      padding: 12px 24px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
  </style>
