org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
# Project is on D: but the pub cache (plugin sources) is on C:. Kotlin's incremental
# cache cannot relate paths on two drives ("this and base files have different roots"),
# which then also shows up as "Could not close incremental caches". Turn it off.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process