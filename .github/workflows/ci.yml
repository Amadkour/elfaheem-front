name: app-ci

on:
  push:
    branches: [production, main, "feature/**"]
  pull_request:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analyze · test · web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: no errors or warnings (info-level lints are tracked, not gated — docs/DECISIONS.md D-002)
        run: |
          flutter analyze --no-fatal-infos --fatal-warnings
      - name: tests (the real suites; test/widget_test.dart is the stock template)
        run: flutter test test/org/ test/export/ test/ui/ test/auth/
      - name: API contract (every path the app calls exists in the server snapshot, D-026)
        run: flutter test test/contract/
      - name: web build
        run: flutter build web --release

  secrets:
    name: secrets (gitleaks — current tree + the commits this push / PR adds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks 8.30.1 (release binary, sha256 verified)
        run: |
          v=8.30.1
          sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "$sum  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: the current tree (allowlist with reasons in .gitleaks.toml)
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'
      # Not the full history: it holds a known leaked key the owner must rotate (docs/DECISIONS.md in the backend).
      - name: the new commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"
          else range="HEAD --not origin/production"; fi            # a new branch: what it adds over production
          echo "scanning commits: $range"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$range"
